<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Project</title>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
.banner{
    position: relative;
    display: flex;
    padding: 100px;
    justify-content: space-between;
    align-items: center;
    min-height: 100vh;
    background-color: white;
    transition: 0.5s;
}
.header{
    position: absolute;
    justify-content: space-between;
    align-items: center;
    top: 0;
    left: 0;
    display: flex;
    width: 100%;
    padding: 20px 100px;


}
header.logo{
    transition: 0.5s;
    color: blueviolet;
     text-decoration:none;
    font-size: 4em;
    font-weight: 700;
}
header .logo span{
    color: Red;
    font-size: 3em;
}
header ul{
    display: flex;
    gap: 40px;
    
}
header ul li{
    list-style: none;
}
header ul li a{
    transition: 0.5s;
    text-decoration: none;
    font-weight: 700;
    font-size: 2em;
    color: #333;
}
.content h2{
    font-size: 3em;
    color: #333;
    transition: 0.5s;
}
.content h2 span{
    color: orange;

}
.content p{
    font-size: 2em;
    color:#666;
    margin: 10px 0;
    transition: 1s;


}
.content button{
    position: relative;
    background: yellowgreen;
    color: white;
    border: none;
    outline: none;
    font-size: 2em;
    padding: 15px 35px;
    letter-spacing: 0.25em;
    margin-left:  20px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.5s;
    font-weight: 700;

}
.content button.chat{
    background: transparent;
    color: #333;

}
.dayNight{
    position:absolute;
    bottom: 25px;
    left: 50%;
    width: 60px;
    height :60px;
    background-color: #f0f0f0;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.5s;
    font-size: 2em;
    


}
      </style>

</head>
<body>
    <section class ="banner" >

        <header>

            <a href = "#" class ="logo">Drop <span>X </span> Piyush </a>
            <ul>
                <li><a href = "#">Home</a></li>
                <li><a href="#">About </a></li>
                <li><a href="#">Work </a></li>
                <li><a href="#">Contact </a></li>
            </ul>

        </header>
        <div class="content">

            <h2> I am <span id ="text"> Super Piyush</span></h2>
            <p> Let's break the metrix</p>
            <button> Join us </button>
            <button> Let's chat</button>

       </div>
       <div class="dayNight">
        <ion-icon name="moon-outline"></ion-icon>
        <ion-icon name="sunny-outline"></ion-icon>


       </div>

    </section>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <sript src ="script.js"></sript>
</body>
</html>
